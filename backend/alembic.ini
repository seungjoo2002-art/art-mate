# Alembic config. The DB URL is NOT stored here; env.py reads DATABASE_URL via app.core.config.
# Keep this file ASCII-only (Windows reads .ini files with the system codepage, e.g. cp949).
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
# File name: 20261103_1530_<rev>_<slug>.py (UTC timestamp keeps both developers' revisions ordered)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC
path_separator = os
output_encoding = utf-8

[post_write_hooks]
hooks = ruff_format
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
