[project]
name = "artmate-backend"
version = "0.1.0"
description = "ART MATE API - AI 기반 미술 실기교육·학생관리 플랫폼 백엔드"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162,<1.0",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy[asyncio]>=2.1.6,<2.2",
    "asyncpg>=0.32",
    "alembic[tz]>=1.20",
    "pyjwt[crypto]>=2.15",
    "tzdata>=2025.2",
    "pillow>=11.0",
    "httpx>=0.28",
]

[project.optional-dependencies]
# Worker 전용 (STT). API 이미지에는 설치하지 않는다: `uv sync --extra stt`
stt = [
    # faster-whisper 1.2.x가 av.open(metadata_errors=...)을 쓰는데 PyAV 18+에서 제거됨 → 17.x 고정
    "av<18",
    "faster-whisper>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "httpx>=0.28",
    "ruff>=0.17",
]

[tool.uv]
package = false

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "ASYNC", # flake8-async
    "RUF",   # ruff-specific
    "FAST",  # FastAPI-specific
]
ignore = [
    "RUF001", # 한글 문자열/주석 허용 (ambiguous unicode)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# AI 프롬프트 본문(한국어 자연어)은 줄바꿈하면 모델 입력이 바뀌므로 길이 제한에서 제외
"app/services/ai_summary.py" = ["E501"]
"app/services/growth_ai.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: 실제 테스트용 PostgreSQL(TEST_DATABASE_URL)이 필요한 테스트",
]
