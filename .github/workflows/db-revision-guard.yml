# 운영 DB 스키마 버전 점검 (v0.9.9). v0.9.8 장애: 코드가 마이그레이션 0015보다 먼저 배포됨.
#
# 이 커밋이 요구하는 Alembic head ↔ 운영 DB의 alembic_version (읽기 전용 SELECT, 출력은 revision 번호뿐)
#  - behind(코드가 더 새 버전)·missing → 실패: 먼저 운영 DB에 마이그레이션을 적용해야 한다
#  - ok·ahead(마이그레이션 선적용) → 통과
#
# 배포를 실제로 막으려면 (docs/deploy-db-revision-check.md):
#  1) GitHub → Settings → Branches → main 보호 규칙에서 "db-revision" 체크를 필수로 지정
#  2) Render → Settings → Auto-Deploy를 "After CI Checks Pass"로 설정 (main push의 이 체크가 실패하면 배포 안 함)
name: db-revision-guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: db-revision-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  db-revision:
    # 포크 PR에는 Secret이 전달되지 않는다 → 같은 저장소에서만 실행
    if: github.repository == 'seungjoo2002-art/art-mate' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    env:
      ENV_FILE: ""
      APP_ENV: production
      # Supabase Session pooler (IPv4). worker와 같은 Secret, 이 점검은 SELECT만 한다
      DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
    steps:
      - name: Check configuration
        working-directory: .
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::WORKER_DATABASE_URL secret이 없어 운영 DB 버전을 확인할 수 없습니다"
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install (API dependencies only)
        run: uv sync --frozen --python 3.12 --no-dev

      - name: Compare code head with production DB revision
        run: uv run --no-sync python -m scripts.check_db_revision
