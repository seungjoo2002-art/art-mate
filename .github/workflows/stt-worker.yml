# STT·AI 요약 Worker (일괄 실행)
#
# 유료 서버 없이 GitHub Actions에서 DB 작업 큐(ai_processing_jobs)를 주기적으로 처리한다.
# - 전사(TRANSCRIBE): faster-whisper small · CPU INT8 · 한국어 (모델은 actions/cache로 재사용)
# - 요약·성장 AI(SUMMARIZE 등): Gemini — 저장소 변수 AI_SUMMARY_ENABLED=true + GEMINI_API_KEY일 때만
# 예약 실행은 GitHub 사정에 따라 늦어지거나 건너뛸 수 있다 (실시간 처리 보장 없음).
# API가 작업을 넣을 때 workflow_dispatch로 바로 실행을 요청한다 (토큰 설정 시).
# 설명: docs/stt-worker-github-actions.md

name: stt-worker

on:
  workflow_dispatch:
    inputs:
      max_jobs:
        description: "이번 실행에서 처리할 최대 작업 수"
        default: "10"
        required: false
      max_minutes:
        description: "이 시간(분)이 지나면 새 작업을 잡지 않음"
        default: "40"
        required: false
  # 예약 실행은 보조 경로다 (실측: 15분 주기 설정에도 5.8~7.1시간 간격). 주 경로는 API의 즉시 실행 요청
  # (WORKER_DISPATCH_TOKEN, docs/stt-worker-github-actions.md §2.3). 혼잡한 정각·15분 단위를 피해 7분 어긋남
  schedule:
    - cron: "7,22,37,52 * * * *"

# 실행은 하나씩 (겹치면 다음 실행은 대기). 큐 선점은 DB에서도 SKIP LOCKED로 중복 방지
concurrency:
  group: stt-worker
  cancel-in-progress: false

permissions:
  contents: read
  # 한 번에 처리 한도까지 처리했으면 남은 작업을 위해 다음 실행을 요청 (v0.9.6)
  actions: write

jobs:
  work:
    # 포크 저장소의 예약 실행 방지 (원본 저장소에서만, 수동 실행은 쓰기 권한자만 가능)
    if: github.repository == 'seungjoo2002-art/art-mate'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: production
      LOG_FORMAT: json
      LOG_LEVEL: INFO
      # Supabase Session pooler 주소 (IPv4). 직접 연결 주소(db.<ref>.supabase.co)는 IPv6라 Actions에서 안 됨
      DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # v0.9.6 요약 제공자: openai(기본) | gemini. 키는 Secret에만 (API 서버·프론트에는 넣지 않음)
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'openai' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # 비우면 앱 기본값(gpt-6.1-terra). 저비용: gpt-6-luna
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      # OpenAI 데이터 무보관(ZDR) 승인 후에만 true → 만 13세 미만 전송 허용
      AI_ZDR_APPROVED: ${{ vars.AI_ZDR_APPROVED || 'false' }}
      # 연령별 전송 허용 (법률 검토 후에만 true). API 서버(Render)와 같은 값이어야 한다
      AI_TEENS_ENABLED: ${{ vars.AI_TEENS_ENABLED || 'false' }}
      AI_TEEN_GUARDIAN_REQUIRED: ${{ vars.AI_TEEN_GUARDIAN_REQUIRED || 'false' }}
      AI_UNDER14_ENABLED: ${{ vars.AI_UNDER14_ENABLED || 'false' }}
      AI_SUMMARY_ENABLED: ${{ vars.AI_SUMMARY_ENABLED || 'false' }}
      GROWTH_AI_ENABLED: ${{ vars.GROWTH_AI_ENABLED || 'false' }}
      # 운영자 확인: Gemini 유료 등급 + 제공자 약관(연령 조항)·동의 범위 검토 (없으면 외부 AI 전송 안 함)
      AI_PROVIDER_TERMS_CONFIRMED: ${{ vars.AI_PROVIDER_TERMS_CONFIRMED || 'false' }}
      # API 서버(Render)와 같은 값이어야 동의가 유효하다 (빈 값은 무시되어 앱 기본값 사용)
      AI_CONSENT_VERSION: ${{ vars.AI_CONSENT_VERSION }}
      AI_GROWTH_CONSENT_VERSION: ${{ vars.AI_GROWTH_CONSENT_VERSION }}
      STT_MODEL: small
      STT_DEVICE: cpu
      STT_COMPUTE_TYPE: int8
      STT_LANGUAGE: ko
      STT_TIMEOUT_SECONDS: "1200"
      STT_MODEL_DIR: ${{ github.workspace }}/.cache/whisper
      HF_HUB_DISABLE_TELEMETRY: "1"
      MAX_JOBS: ${{ inputs.max_jobs || '10' }}
      MAX_MINUTES: ${{ inputs.max_minutes || '40' }}
    steps:
      - name: Check configuration
        id: config
        working-directory: .
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::WORKER_DATABASE_URL secret이 없어 실행하지 않습니다"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.config.outputs.ready == 'true'

      - uses: astral-sh/setup-uv@v7
        if: steps.config.outputs.ready == 'true'
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install (API dependencies only)
        if: steps.config.outputs.ready == 'true'
        run: uv sync --frozen --python 3.12 --no-dev

      - name: Check queue
        id: queue
        if: steps.config.outputs.ready == 'true'
        run: uv run --no-sync python -m app.worker --pending

      - name: Install STT (faster-whisper)
        if: steps.config.outputs.ready == 'true' && steps.queue.outputs.transcribe != '0'
        run: uv sync --frozen --python 3.12 --no-dev --extra stt

      - name: Restore Whisper model cache
        id: model-cache
        if: steps.config.outputs.ready == 'true' && steps.queue.outputs.transcribe != '0'
        uses: actions/cache@v4
        with:
          path: .cache/whisper
          key: whisper-small-ct2-v1

      - name: Download Whisper model (cache miss)
        if: >-
          steps.config.outputs.ready == 'true' && steps.queue.outputs.transcribe != '0'
          && steps.model-cache.outputs.cache-hit != 'true'
        run: >-
          uv run --no-sync python -c "from faster_whisper.utils import download_model;
          import os; download_model(os.environ['STT_MODEL'], cache_dir=os.environ['STT_MODEL_DIR'])"

      - name: Process queue
        id: batch
        if: steps.config.outputs.ready == 'true'
        env:
          # 전사 작업이 없으면 STT를 켜지 않는다 (모델 로드·설치 생략)
          STT_ENABLED: ${{ steps.queue.outputs.transcribe != '0' }}
        run: >-
          uv run --no-sync python -m app.worker --once
          --max-jobs "$MAX_JOBS" --max-seconds "$(( MAX_MINUTES * 60 ))"

      # 처리 한도(max_jobs)까지 처리했으면 큐에 작업이 더 있을 수 있다 → 다음 실행을 바로 요청.
      # 실제로 한도만큼 처리했을 때만 요청하므로, 처리할 수 없는 작업 때문에 무한 반복하지 않는다.
      # (GITHUB_TOKEN으로 요청한 workflow_dispatch는 새 실행을 만든다)
      - name: Continue if the batch hit the limit
        if: steps.batch.outputs.hit_limit == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run stt-worker.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
