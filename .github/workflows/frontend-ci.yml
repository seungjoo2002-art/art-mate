name: frontend-ci

# 프론트엔드 변경 시 ESLint · Vitest 전체 · 프로덕션 빌드 (배포는 하지 않음, 배포는 Vercel 연동)
# Node: package-lock.json의 엔진 범위 교집합 (vitest 5: ^22.12 || ^24, vite 8: ^20.19 || >=22.12) → 24
on:
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]
  push:
    branches: [main, develop]
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (lockfile)
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Vitest (all tests)
        run: npm test
      - name: Production build
        # 빌드 확인용 더미 주소 (실제 API·Supabase에 접속하지 않음, 결과물은 배포하지 않음)
        env:
          VITE_API_BASE_URL: https://api.example.invalid
          VITE_SUPABASE_URL: https://example.invalid
          VITE_SUPABASE_ANON_KEY: ci-build-placeholder
        run: npm run build
